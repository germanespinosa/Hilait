[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "hilait"
version = "0.1.2"
description = "Human-in-the-loop SSH workspace with a local web interface and agent access"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Hilait contributors"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "paramiko>=3.5,<5",
  "cryptography>=43,<47",
  "platformdirs>=4,<6",
  "httpx>=0.27,<1",
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "asyncssh>=2.18,<3"]

[project.scripts]
hilait = "hilait.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hilait"]

[tool.hatch.build.targets.wheel.force-include]
"THIRD-PARTY-NOTICES.md" = "hilait/THIRD-PARTY-NOTICES.md"
"licenses/xterm-MIT.txt" = "hilait/licenses/xterm-MIT.txt"
"licenses/xterm-graphemes.txt" = "hilait/licenses/xterm-graphemes.txt"
"licenses/jetbrains-mono-OFL.txt" = "hilait/licenses/jetbrains-mono-OFL.txt"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
